<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D0D12" />
  <title>AIA Kings | Websites and AI SEO for Local Service Businesses</title>
  <meta name="description" content="No website? I build one, live in days. Have a website? I get it found on Google and in AI answers. Every call answered and every job ending with a review request. Local service businesses, Houston, Texas." data-rh="true">

  <!-- Fonts load without blocking the first paint. The headline and the button
       render in a fallback face immediately and swap when the webfont lands. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,300;1,400&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,300;1,400&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,300;1,400&display=swap">
  </noscript>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "AI Automation Kings",
    "alternateName": "AIA Kings",
    "url": "https://aiautomationkings.com",
    "email": "nate@aiautomationkings.com",
    "founder": {
      "@type": "Person",
      "name": "Nathan Mamo",
      "jobTitle": "Founder"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Houston",
      "addressRegion": "TX",
      "addressCountry": "US"
    },
    "areaServed": [
      { "@type": "City", "name": "Houston" },
      { "@type": "State", "name": "Texas" }
    ],
    "description": "Websites and AI SEO for local service businesses. If there is no website, I build one in days, readable by Google and AI answer tools from the first line. If there is one, I get it found. Every inbound call gets answered and booked, and every job ends with a review request.",
    "knowsAbout": [
      "answer engine optimization",
      "AEO",
      "AI SEO",
      "local SEO",
      "generative engine optimization",
      "local service business websites",
      "Google Business Profile optimization",
      "online review generation",
      "AI receptionist",
      "missed call recovery"
    ],
    "serviceType": [
      "Answer Engine Optimization",
      "AI SEO",
      "Local Business Website Design",
      "Review Generation",
      "AI Receptionist"
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Services for local service businesses",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Website build",
            "description": "A fast site for a local service business that has none, live in days and readable by Google and AI answer tools from the first line."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "AI SEO and answer engine optimization",
            "description": "Question-shaped pages, structured data, listing consistency, and business profile upkeep so the tools people ask can read the business and have a reason to name it."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Review generation",
            "description": "Every finished job ends with the same review request to every customer, with no filtering and no incentives."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "AI receptionist",
            "description": "Every inbound call answered, common questions handled, and the job put on the calendar, including nights and weekends."
          }
        }
      ]
    }
  }
  </script>
</head>

<body>
  <!-- Global Noise Overlay -->
  <svg class="noise-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
